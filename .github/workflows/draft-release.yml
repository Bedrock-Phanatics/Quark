name: Draft Quark release

on:
  push:
    tags: ['[0-9]*', 'v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/main.yml

  build:
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-php
        with:
          php: '8.4'
          dev: 'false'

      - name: Validate release version
        id: version
        run: |
          version=$(php build/dump-version-info.php base_version)
          test "${GITHUB_REF_NAME#v}" = "$version"
          test "$(php build/dump-version-info.php is_dev)" = false
          test "$(php build/dump-version-info.php suffix_valid)" = true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(php build/dump-version-info.php prerelease)" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: |
          php vendor/axolotl-pm/bedrock-data/.minify_json.php
          php -dphar.readonly=0 build/server-phar.php --git "$GITHUB_SHA" --build "$GITHUB_RUN_NUMBER"
          php build/generate-build-info-json.php \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ID" \
            https://github.com/Bedrock-Phanatics/PHP-Binaries/releases/tag/pm5-php-8.4-latest \
            > build_info.json
          php tools/generate-permission-doc.php rst
          test -s Quark.phar
          test -s build_info.json
          test -s core-permissions.rst

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quark-release
          if-no-files-found: error
          retention-days: 7
          path: |
            Quark.phar
            start.sh
            start.cmd
            build_info.json
            core-permissions.rst

  draft:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: quark-release
          path: release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; leaving it unchanged.'
            exit 0
          fi
          printf '%s\n' \
            "See the [Quark changelog](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)." \
            '' \
            'Requires 64-bit PHP 8.4 and the extensions in composer.json.' \
            'Download the recommended runtime from https://github.com/Bedrock-Phanatics/PHP-Binaries/releases/tag/pm5-php-8.4-latest.' \
            > release-notes.md
          flags=(--draft)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Quark $VERSION" \
            --notes-file release-notes.md "${flags[@]}"
