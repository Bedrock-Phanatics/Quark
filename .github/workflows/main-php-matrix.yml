name: PHP checks

on:
  workflow_call:
    inputs:
      php:
        description: PHP version in X.Y format
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-php
        id: setup
        with:
          php: ${{ inputs.php }}

      - name: Validate Composer metadata and runtime
        run: |
          # The protocol fork is deliberately pinned to a commit for reproducibility.
          composer validate
          composer check-platform-reqs
          php tests/runtime.php
          bash tests/runtime-bootstrap.sh

      - name: Verify generated code is reproducible
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          for pass in 1 2; do
            echo "Clean generation pass $pass"
            rm -rf generated
            composer update-codegen
            git diff --exit-code -- generated
            test -z "$(git ls-files --others --exclude-standard generated)"
          done
          php build/codegen/check-file-collisions.php

      - name: Run PHPStan
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: php vendor/bin/phpstan analyze --no-progress --memory-limit=2G

      - name: Run PHPUnit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: php vendor/bin/phpunit --bootstrap vendor/autoload.php --fail-on-warning --display-warnings tests/phpunit

      # make-server removes development dependencies, so integration must run last.
      - name: Run integration tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: timeout 180 bash tests/travis.sh -t4
