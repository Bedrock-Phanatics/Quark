name: Docker image CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Initialize PHP build submodule
      run: git submodule update --init build/php

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Build image for tag
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ github.workspace }}
        push: false
        load: true
        file: ${{ github.workspace }}/docker/Dockerfile
        tags: local-quark
        build-args: |
          GIT_HASH=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify startup, Quark 6 plugins and persistence
      run: bash docker/test.sh local-quark
