name: Publish Quark container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: Published Quark release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: container-${{ github.event.release.tag_name || inputs.release }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Bedrock-Phanatics/Quark'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release }}

      - name: Validate published release and select tags
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern build_info.json --dir "$RUNNER_TEMP"
          version=$(jq -er '.base_version' "$RUNNER_TEMP/build_info.json")
          test "${RELEASE_TAG#v}" = "$version"
          test "$(jq -r '.is_dev' "$RUNNER_TEMP/build_info.json")" = false
          commit=$(git rev-parse HEAD)
          test "$commit" = "$(jq -r '.git_commit' "$RUNNER_TEMP/build_info.json")"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "build=$(jq -er '.build | numbers' "$RUNNER_TEMP/build_info.json")" >> "$GITHUB_OUTPUT"
          image=ghcr.io/bedrock-phanatics/quark
          echo "$image:$RELEASE_TAG" > "$RUNNER_TEMP/quark-image-tags"
          if [ "$(jq -r '.channel' "$RUNNER_TEMP/build_info.json")" = stable ]; then
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            printf '%s\n' "$image:${version%%.*}" "$image:${version%.*}" "$image:latest" >> "$RUNNER_TEMP/quark-image-tags"
          fi
          {
            echo 'tags<<EOF'
            cat "$RUNNER_TEMP/quark-image-tags"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Initialize PHP build submodule
        run: git submodule update --init build/php

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build release image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.release.outputs.tags }}
          build-args: |
            GIT_HASH=${{ steps.release.outputs.commit }}
            BUILD_NUMBER=${{ steps.release.outputs.build }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify release image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release }}
        run: bash docker/test.sh "ghcr.io/bedrock-phanatics/quark:$RELEASE_TAG"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image tags
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done < "$RUNNER_TEMP/quark-image-tags"
