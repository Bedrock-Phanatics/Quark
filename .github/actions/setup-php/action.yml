name: Set up Quark PHP
description: Build and validate the pinned packaged runtime and install locked dependencies
inputs:
  php:
    description: PHP version in X.Y format
    required: true
  dev:
    description: Install development dependencies
    default: 'true'
runs:
  using: composite
  steps:
    - name: Validate PHP version
      shell: bash
      env:
        PHP_VERSION: ${{ inputs.php }}
      run: test "$PHP_VERSION" = 8.4

    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: '8.4'
        tools: composer:2.10.3
        coverage: none

    - name: Initialize pinned runtime sources
      shell: bash
      run: git submodule update --init build/php

    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: 0.17.0

    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: runtime
      with:
        path: build/php/bin
        key: quark-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/php/compile.sh', 'build/php/windows-compile-vs.ps1', 'build/php/native.py', 'build/php/versions.env', 'build/php/sources.sha256', 'build/php/windows-deps.sha256') }}

    - name: Build Linux runtime
      if: runner.os == 'Linux' && steps.runtime.outputs.cache-hit != 'true'
      shell: bash
      working-directory: build/php
      run: |
        sudo apt-get update
        sudo apt-get install -y make autoconf automake libtool libtool-bin m4 curl gzip bzip2 xz-utils bison g++ git cmake pkg-config re2c ca-certificates file python3 patchelf
        ./compile.sh -t linux64 -j "$(nproc)" -g -P5 -z 8.4

    - name: Build Windows runtime
      if: runner.os == 'Windows' && steps.runtime.outputs.cache-hit != 'true'
      shell: pwsh
      working-directory: build/php
      env:
        PM_VERSION_MAJOR: '5'
        PHP_VERSION_BASE: '8.4'
        SOURCES_PATH: ${{ runner.temp }}\quark-php-sdk
      run: ./windows-compile-vs.ps1

    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      if: steps.runtime.outputs.cache-hit != 'true'
      with:
        path: build/php/bin
        key: ${{ steps.runtime.outputs.cache-primary-key }}

    - name: Extract and validate runtime package
      shell: bash
      run: |
        set -euo pipefail
        runtime="$RUNNER_TEMP/quark-php"
        if [ "$RUNNER_OS" = Windows ]; then
          #tar reads D: as a remote host
          runtime="$(cygpath -u "$runtime")"
        fi
        mkdir -p "$runtime/empty-ini"
        tar -czf "$runtime/runtime.tar.gz" -C build/php bin
        tar -xzf "$runtime/runtime.tar.gz" -C "$runtime"
        if [ "$RUNNER_OS" = Windows ]; then
          php_bin="$runtime/bin/php"
          path_entry="$(cygpath -w "$php_bin")"
          extension_dir="$(cygpath -m "$php_bin/ext")"
          ini="$(cygpath -m "$php_bin/php.ini")"
          scan_dir="$(cygpath -m "$runtime/empty-ini")"
          openssl_conf="$(cygpath -m "$php_bin/extras/ssl/openssl.cnf")"
          openssl_modules="$(cygpath -m "$php_bin/extras/ssl")"
        else
          php_bin="$runtime/bin/php7/bin"
          path_entry="$php_bin"
          extension_dir=$(find "$runtime/bin/php7/lib/php/extensions" -mindepth 1 -maxdepth 1 -type d -name '*debug-zts*')
          ini="$php_bin/php.ini"
          scan_dir="$runtime/empty-ini"
          openssl_conf="$runtime/bin/php7/openssl.cnf"
          openssl_modules="$runtime/bin/php7/lib/ossl-modules"
        fi
        test -d "$extension_dir"
        printf '\nextension_dir="%s"\n' "$extension_dir" >> "$php_bin/php.ini"
        export PHPRC="$ini"
        export PHP_INI_SCAN_DIR="$scan_dir"
        export OPENSSL_CONF="$openssl_conf"
        export OPENSSL_MODULES="$openssl_modules"
        expected_php=$(sed -n 's/^PHP_VERSION=//p' build/php/versions.env)
        test "$("$php_bin/php" -r 'echo PHP_VERSION;')" = "$expected_php"
        "$php_bin/php" -v
        echo "$path_entry" >> "$GITHUB_PATH"
        echo "PHPRC=$ini" >> "$GITHUB_ENV"
        echo "PHP_INI_SCAN_DIR=$scan_dir" >> "$GITHUB_ENV"
        echo "OPENSSL_CONF=$openssl_conf" >> "$GITHUB_ENV"
        echo "OPENSSL_MODULES=$openssl_modules" >> "$GITHUB_ENV"
        timeout 60 "$php_bin/php" -c "$ini" build/php/tests/generic/smoke.php
        timeout 60 "$php_bin/php" -c "$ini" build/php/tests/generic/native.php
        if [ "$RUNNER_OS" = Linux ]; then
          python3 build/php/tests/validate-package.py "$runtime/runtime.tar.gz"
          python3 build/php/tests/check-libraries.py "$runtime/bin/php7"
        else
          python build/php/tests/validate-package.py "$runtime/runtime.tar.gz"
        fi

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: quark-runtime-${{ runner.os }}-${{ runner.arch }}
        path: ${{ runner.temp }}/quark-php/runtime.tar.gz
        if-no-files-found: error

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/composer/files
        key: composer-v2-${{ runner.os }}-${{ inputs.php }}-${{ hashFiles('composer.lock') }}
        restore-keys: composer-v2-${{ runner.os }}-${{ inputs.php }}-

    - name: Install locked dependencies
      shell: bash
      env:
        INSTALL_DEV: ${{ inputs.dev }}
      run: |
        if [ "$INSTALL_DEV" = true ]; then
          composer install --prefer-dist --no-interaction --no-progress
        else
          composer install --no-dev --classmap-authoritative --prefer-dist --no-interaction --no-progress
        fi
