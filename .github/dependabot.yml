version: 2
updates:
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: weekly
    time: "10:00"
  open-pull-requests-limit: 10
  ignore:
    # Review analyzer upgrades separately because they can change diagnostics.
    - dependency-name: phpstan/phpstan
  groups:
    production-patch-updates:
      dependency-type: production
      patterns:
        - "*"
      update-types:
        - "patch"
    development-patch-updates:
      dependency-type: development
      patterns:
        - "*"
      update-types:
        - "patch"
    phpstan:
      patterns:
        - "phpstan/*"

- package-ecosystem: gitsubmodule
  directory: "/"
  schedule:
    interval: daily

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  groups:
    github-actions:
      patterns: ["*"]

- package-ecosystem: docker
  directory: "/docker"
  schedule:
    interval: weekly
