name: Crash
description: Report a crash in Quark (not plugins)
title: Server crashed
body:
  - type: markdown
    attributes:
      value: |
        > [!CAUTION]
        > If the crash can be triggered over the network (e.g. by a player / hack client), DO NOT report it here.
        > 
        > Read our [Security Policy](https://github.com/Bedrock-Phanatics/Quark/blob/v6.0.0/SECURITY.md) first.

        > [!TIP]
        > Don't paste raw crashdump data into the issue.
        >
        > Attach the local crashdump `.log` file to the issue after checking it for sensitive information.
        > You may also link a reviewed crashdump using [GitHub Gist](https://gist.github.com).

  - type: input
    id: crashdump-url
    attributes:
      label: Link to crashdump
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional comments (optional)
      description: Any other information that might help us solve the problem
