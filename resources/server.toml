# Quark server configuration. Restart after editing. Intervals use ticks (20 ticks = 1 second).
config-version = 2

[server]
motd = 'Quark Server'
max-players = 20
# Highest view distance in chunks, from 2 to 96. Per-world caps go in [view-distances].
view-distance = 16
language = 'eng'
force-language = false
whitelist = false
shutdown-message = 'Server closed'
enable-dev-builds = false

[gameplay]
# SURVIVAL, CREATIVE, ADVENTURE, or SPECTATOR. Force applies the default mode on login.
gamemode = 'SURVIVAL'
force-gamemode = false
# 0 = peaceful, 1 = easy, 2 = normal, 3 = hard. Hardcore forces hard difficulty.
difficulty = 2
hardcore = false
pvp = true
# Flush combat feedback early, at most once per player per tick.
combat-low-latency-feedback = true

[player]
save-data = true
# Compare the player's Xbox ID with saved data before admitting them.
verify-xuid = true

[network]
# Empty addresses listen on all interfaces for that address family.
# NetherNet requires an IP literal; RakNet also accepts hostnames.
bind-address = ''
bind-address-v6 = ''
# NetherNet signaling uses TCP; RakNet and Query use UDP.
port = 19132
port-v6 = 19133
enable-ipv6 = true
# Query uses the configured server ports, including when NetherNet is selected.
enable-query = true
query-plugins = true
xbox-auth = true
enable-encryption = true
# A proxy with one of these base64 DER public keys can log in as any player.
trusted-proxy-keys = []
# Forward the IPv4 UDP port via UPnP; NetherNet signaling and ICE need separate forwarding.
upnp-forwarding = false

[network.compression]
# zlib or snappy. Snappy requires ext-snappy; otherwise zlib is used.
algorithm = 'zlib'
# Minimum batch size in bytes; -1 disables compression, 0 compresses every batch.
threshold = 256
# Zlib level from 1 to 9; higher levels trade CPU time for bandwidth.
level = 6
# Offloading large batches can free main-thread time and delay delivery.
async = false
async-threshold = 10000

[transport]
# Up to eight comma-separated names. Built-in transports: nethernet, raknet.
name = 'nethernet'

[transport.nethernet]
# Persist this identity file across restarts. Relative paths start at the data directory.
key-file = 'nethernet-identity.der'
# Local-network discovery uses UDP 7551; broadcasts do not cross most container networks.
lan-discovery = true
# Share one ICE UDP socket. Vanilla client compatibility is still unverified.
ice-udp-mux = false
# Optional inclusive ICE UDP range (1..65535). Omission allows arbitrary UDP ports.
# Docker/Pterodactyl: allocate and forward the entire range with unchanged UDP ports.
# port-range = [30000, 30100]
# Optional reachable public IPs (up to eight, without ports); set a forwarded range above.
# advertise-addresses = ['203.0.113.7']
# Optional STUN/TURN URLs, e.g. 'stun:stun.example.com:3478' (at most 32, 512 bytes each).
# STUN discovers NAT mappings; TURN relays traffic. Empty configures neither.
ice-servers = []
# Deliver unreliable messages to a registered PHP handler; otherwise drop them natively.
unreliable-events = false

[transport.raknet]
# RakNet MTU in bytes.
max-mtu-size = 1492

[world]
name = 'world'
# Empty seeds are random. Generator names are registered by Quark or plugins.
seed = ''
generator = 'DEFAULT'
generator-settings = ''
auto-save = true
autosave-interval = 6000
default-format = 'leveldb'
# off, manual, or automatic. Automatic converts LevelDB to ZigriteDB at startup, keeping backups.
format-migration = 'manual'

# Optional per-world view distance caps keyed by world folder name, from 2 to server.view-distance.
# Worlds not listed use server.view-distance. Quote names that contain dots or spaces.
# [view-distances]
# nether = 8
# "mini games" = 6

[chunks]
send-per-tick = 4
spawn-radius = 4
# Radius in chunks. Zero disables player-driven chunk ticking.
tick-radius = 3
# With autosave on, unload view-only chunks outside the tick radius; updates and entity visibility pause there.
unload-view-only-chunks = true
random-ticks-per-subchunk = 3
# Block names excluded from random ticks.
disabled-random-tick-blocks = []
population-queue-size = 32

[entities]
# Merge radii in blocks (0..8). Larger radii can merge entities through walls.
item-merge-radius = 0.5
xp-orb-merge-radius = 0.5
# Throttle eligible entities beyond this many blocks, rounded up to chunks. Zero disables throttling.
activation-range = 0
inactive-tick-interval = 20

[redstone]
enabled = true
# all, allowlist, or blocklist, using world folder names.
world-policy = 'all'
worlds = []
max-wire-network-size = 65536
max-scheduled-updates = 262144
max-updates-per-tick = 8192
pistons-enabled = true
max-piston-actions-per-tick = 1024
dispensers-enabled = true
max-dispenser-actions-per-tick = 4096

[hoppers]
# Disabling stops item movement but keeps hopper contents.
enabled = true
# Game ticks between transfers, from 1 to 1200. Vanilla is 8.
transfer-cooldown = 8
# Items moved per push or pull, from 1 to 64. Dropped items are collected whole, as in vanilla.
items-per-transfer = 1
# Hopper updates per tick across all worlds. Hoppers past the limit wait their turn. Zero is unlimited.
max-updates-per-tick = 512

[tnt-limits]
# When enabled, zero leaves the corresponding limit unrestricted.
enabled = false
max-active-per-chunk = 64
max-active-nearby = 192
max-ignitions-per-chunk-per-tick = 24
max-dispenser-ignitions-per-second = 20

[block-physics]
# Non-vanilla: sand, gravel and other falling blocks over open air appear right above where they land,
# skipping the visible fall. Landing, damage and events are unchanged.
fast-falling-blocks = false

[weather]
cycle = true
# 1-in-N chance per ticking chunk per tick during thunderstorms. Zero disables strikes.
lightning-chance = 100000
lightning-fire = true

[performance]
# auto sizes the async pool from the CPU count; otherwise use a positive worker count.
async-workers = 'auto'

[memory]
# MiB; zero disables a limit. The async hard limit applies per worker.
global-limit = 0
main-limit = 0
main-hard-limit = 1024
async-worker-hard-limit = 256
check-rate = 20
continuous-trigger = true
# Repeat low-memory events after this many checks.
continuous-trigger-rate = 30
dump-async-workers = true
# Cap view distance during low memory. Zero disables the cap.
low-memory-view-distance = 4

[memory.garbage-collection]
# Automatic cycle collection on the main thread and workers. Disabling can increase memory use.
php-automatic = true
# Quark's adaptive collection threshold in buffered roots. Zero disables it.
threshold = 10001
# Periodic main-thread collection interval in ticks. Zero disables it.
period = 36000

[logging]
# debug, info, notice, warning, error, critical, alert, or emergency.
console-level = 'info'
file-level = 'info'
json-level = 'info'
# columns or compact.
console-style = 'columns'
# Also write logs/server.log.jsonl.
json = false
# Queue budget in bytes. Routine events can be dropped when it fills.
buffer-bytes = 8388608
flush-ms = 200
# Rotation size in bytes. Zero archives keeps them all.
max-file-size = 33554432
max-archives = 0

[console]
enable-input = true
title-tick = true

[diagnostics]
enable-profiling = false
# Zero keeps all crash reports and profiles.
max-crash-reports = 0
max-profiles = 0
# Record Pulse for 60 seconds after a tick slower than this many milliseconds, at most once per 10 minutes. Zero disables.
pulse-auto-capture-ms = 0

[crash-dumps]
include-code = true
include-settings = true
include-phpinfo = false

[auto-updater]
enabled = false
preferred-channel = 'stable'
# Leave blank unless you run a compatible update service.
host = ''
warn-console = true

[migration]
# Opt in to moving legacy data; --migrate-legacy also enables it.
auto-on-startup = false

# Optional command aliases. An empty list removes an unqualified alias.
# [aliases]
# stop = []
# abort = ['quark:stop']

# Optional world overrides keyed by folder name. Difficulty: peaceful, easy, normal, or hard.
# [worlds.example]
# seed = 404
# generator = 'FLAT'
# preset = ''
# difficulty = 'normal'
# dimension = 'minecraft:overworld'
